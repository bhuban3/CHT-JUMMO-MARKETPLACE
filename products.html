<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Products</title>
</head>

<body>
  <header id="nav"></header>
  <main class="container py-4">
    <h1 class="h3">Products</h1>
    <div id="m"></div>
    <div class="row g-2 mb-4">
      <div class="col-md-5"><input class="form-control" id="q" placeholder="Search by name" aria-label="Search"></div>
      <div class="col-6 col-md-4"><select class="form-select" id="c" aria-label="Category">
          <option value="">All categories</option>
        </select></div>
      <div class="col-6 col-md-3"><input class="form-control" id="mx" type="number" min="0" placeholder="Max price"
          aria-label="Max price"></div>
    </div>
    <div id="g" class="row g-3"></div>
  </main>
  <footer id="site-footer"></footer>
  <div class="modal fade" id="od" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="of">
        <div class="modal-header">
          <h2 class="modal-title h5" id="dt"></h2><button type="button" class="btn-close" data-bs-dismiss="modal"
            aria-label="Close"></button>
        </div>
        <div class="modal-body"><label class="form-label" for="qty">Quantity</label><input class="form-control" id="qty"
            type="number" min="1" value="1" required>
          <label class="form-label mt-3" for="contactNo">Contact number</label><input class="form-control" id="contactNo"
            type="tel" maxlength="32" required placeholder="Phone number for this order">
          <label class="form-label mt-3" for="addr">Delivery address</label><textarea class="form-control" id="addr"
            rows="2" maxlength="500" required placeholder="Enter the address for this order"></textarea>
          <label class="form-label mt-3" for="nt">Note to seller</label><textarea class="form-control" id="nt"
            rows="2"></textarea>
        </div>
        <div class="modal-footer"><button class="btn btn-success">Send order request</button></div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onUser, db, collection, list, listCatalog, addDoc, serverTimestamp, esc, card, say } from "./js/app.js";
    let me, all = [], cur, categoriesLoaded = false;
    const modal = new bootstrap.Modal(od);
    [contactNo, addr].forEach(field => field.oninput = () => field.setCustomValidity(""));
    onUser(async p => {
      me = p;
      const requestedCategory = new URLSearchParams(location.search).get("cat") || "";
      await Promise.all([
        listCatalog("categories", collection(db, "categories"), cats => {
          const selectedCategory = categoriesLoaded ? c.value : requestedCategory;
          c.innerHTML = '<option value="">All categories</option>' + cats.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
          c.value = selectedCategory;
          categoriesLoaded = true;
        }),
        listCatalog("products", collection(db, "products"), products => { all = products; draw(); })
      ]);
    });
    function draw() {
      const t = q.value.toLowerCase(), max = Number(mx.value) || Infinity;
      g.innerHTML = all.filter(p => p.name.toLowerCase().includes(t) && (!c.value || p.categoryId === c.value) && p.price <= max)
        .map(p => card(p, `<small>${esc(p.description)}</small><small class="text-muted">${p.stock} in stock</small><button class="btn btn-success btn-sm mt-auto" data-id="${p.id}">Request order</button>`)).join("") || '<p class="text-muted">No products match. Try a different search.</p>';
    }
    [q, c, mx].forEach(el => el.oninput = draw);
    g.onclick = e => {
      const id = e.target.dataset.id; if (!id) return;
      if (!me) return location.href = "login.html";
      if (me.role !== "buyer") return say(m, "Only buyer accounts can place order requests.");
      cur = all.find(p => p.id === id); dt.textContent = "Order: " + cur.name; qty.value = 1; contactNo.value = ""; addr.value = ""; nt.value = ""; modal.show();
    };
    of.onsubmit = async e => {
      e.preventDefault();
      const buyerPhoneValue = contactNo.value.trim();
      if (!buyerPhoneValue) { contactNo.setCustomValidity("Enter a contact number for this order."); contactNo.reportValidity(); return; }
      contactNo.setCustomValidity("");
      const buyerAddress = addr.value.trim();
      if (!buyerAddress) { addr.setCustomValidity("Enter a delivery address."); addr.reportValidity(); return; }
      addr.setCustomValidity("");
      await addDoc(collection(db, "orders"), { buyerId: me.uid, buyerName: me.name, buyerPhone: buyerPhoneValue, buyerAddress, sellerId: cur.sellerId, sellerName: cur.sellerName, productId: cur.id, productName: cur.name, categoryName: cur.categoryName, price: cur.price, qty: Number(qty.value), note: nt.value, status: "Pending", createdAt: serverTimestamp() });
      modal.hide(); say(m, "Order request sent. Track it in your dashboard.", true);
    };
  </script>
</body>

</html>
