<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Dashboard</title>
</head>

<body>
  <header id="nav"></header>
  <main class="container py-4">
    <h1 class="h3" id="h"></h1>
    <div id="m"></div>
    <div id="vbox" hidden></div>
    <div id="seller" hidden>
      <form class="card card-body mb-4" id="pf">
        <h2 class="h5" id="pt">Add a product</h2>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="pn">Name</label><input class="form-control" id="pn"
              required></div>
          <div class="col-md-6"><label class="form-label" for="pc">Category</label><select class="form-select" id="pc"
              required></select></div>
          <div class="col-6 col-md-3"><label class="form-label" for="pp">Price (৳)</label><input class="form-control"
              id="pp" type="number" min="0" required></div>
          <div class="col-6 col-md-3"><label class="form-label" for="ps">Stock</label><input class="form-control"
              id="ps" type="number" min="0" required></div>
            <div class="col-md-6"><label class="form-label" for="pi">Product image</label><input class="form-control"
              id="pi" type="file" accept="image/jpeg,image/png,image/webp"><div class="form-text">JPEG, PNG, or WebP, up to 5 MB. Images are compressed before saving.</div><img id="pipreview" class="upload-preview mt-2" alt="Product image preview" hidden></div>
          <div class="col-12"><label class="form-label" for="pd">Description</label><textarea class="form-control"
              id="pd" rows="2" required></textarea></div>
        </div>
        <div class="mt-3"><button class="btn btn-success" type="submit">Save product</button> <button
            class="btn btn-outline-secondary" type="button" id="pr">Clear</button></div>
      </form>
      <h2 class="h5">My products</h2>
      <div class="table-responsive card card-body mb-4">
        <table class="table align-middle mb-0" id="pl"></table>
      </div>
    </div>
    <h2 class="h5" id="oh"></h2>
    <div class="table-responsive card card-body">
      <table class="table align-middle mb-0" id="ol"></table>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { guard, db, collection, doc, list, getDoc, setDoc, query, where, addDoc, updateDoc, deleteDoc, serverTimestamp, runTransaction, esc, money, say, badge, uploadImage, uploadProductImage, invalidateCatalogCache } from "./js/app.js";
    let me, prods = [], editId = null, currentProductImage = "", productPreviewUrl = "";
    guard(["buyer", "seller"], async p => {
      me = p; h.textContent = "Welcome, " + p.name;
      oh.textContent = p.role === "seller" ? "Incoming order requests" : "My order requests";
      if (p.role === "seller") await gate();
      load();
    });
    async function gate() {
      vbox.hidden = false;
      if (me.approved) {
        vbox.innerHTML = '<div class="alert alert-success">Identity verified. You can list products.</div>'; seller.hidden = false;
        const cats = await list(collection(db, "categories"));
        pc.innerHTML = cats.map(c => `<option value="${esc(c.id)}" data-n="${esc(c.name)}">${esc(c.name)}</option>`).join(""); return;
      }
      const s = await getDoc(doc(db, "verifications", me.uid)), v = s.exists() ? s.data() : null;
      if (v?.status === "Pending") return vbox.innerHTML = '<div class="alert alert-warning">Your identity verification is under admin review. You can list products once it is approved.</div>';
      const note = v?.status === "Rejected" ? `<div class="alert alert-danger">Your verification was rejected: ${esc(v.adminNote || "no reason given")}. Correct the details and submit again.</div>` : '<div class="alert alert-info">Verify your identity to start selling. The admin will review it.</div>';
      let verificationImageUrl = v?.docUrl || "", verificationPreviewUrl = "";
      vbox.innerHTML = note + `<form class="card card-body mb-4" id="vf"><h2 class="h5">Seller identity verification</h2><div class="row g-3">
  <div class="col-md-6"><label class="form-label" for="vn">Full name (as on ID)</label><input class="form-control" id="vn" required value="${esc(v?.fullName || me.name)}"></div>
  <div class="col-md-6"><label class="form-label" for="vs">Shop / what you sell</label><input class="form-control" id="vs" required value="${esc(v?.shopName || "")}"></div>
  <div class="col-md-4"><label class="form-label" for="vt">ID type</label><select class="form-select" id="vt"><option>National ID</option><option>Passport</option><option>Driving License</option></select></div>
  <div class="col-md-4"><label class="form-label" for="vi">ID number</label><input class="form-control" id="vi" required value="${esc(v?.idNumber || "")}"></div>
  <div class="col-md-4"><label class="form-label" for="vu">ID photo</label><input class="form-control" id="vu" type="file" accept="image/jpeg,image/png,image/webp"><div class="form-text">JPEG, PNG, or WebP, up to 5 MB. Images are compressed before saving.</div><img id="vipreview" class="upload-preview mt-2" alt="ID photo preview" hidden></div></div>
  <div class="form-text mt-2">Your ID photo is only readable by you and the admin.</div><div id="vmsg" class="mt-2" aria-live="polite"></div><div class="mt-3"><button class="btn btn-primary" type="submit">Submit for review</button></div></form>`;
      if (v?.idType) vt.value = v.idType;
      vu.required = !verificationImageUrl;
      if (verificationImageUrl) { vipreview.src = verificationImageUrl; vipreview.hidden = false; }
      vu.onchange = () => {
        vu.setCustomValidity("");
        if (verificationPreviewUrl) URL.revokeObjectURL(verificationPreviewUrl);
        if (vu.files[0]) {
          verificationPreviewUrl = URL.createObjectURL(vu.files[0]);
          vipreview.src = verificationPreviewUrl; vipreview.hidden = false;
        } else if (verificationImageUrl) {
          vipreview.src = verificationImageUrl; vipreview.hidden = false;
        } else vipreview.hidden = true;
      };
      vf.onsubmit = async e => {
        e.preventDefault();
        const file = vu.files[0];
        if (!file && !verificationImageUrl) { vu.setCustomValidity("Choose an ID photo to upload."); vu.reportValidity(); return; }
        const button = vf.querySelector("button[type=submit]"); button.disabled = true;
        vmsg.className = "mt-2 form-text"; vmsg.textContent = "Uploading photo and submitting...";
        try {
          const docUrl = file ? await uploadImage(file) : verificationImageUrl;
          await setDoc(doc(db, "verifications", me.uid), { sellerId: me.uid, sellerName: me.name, fullName: vn.value, shopName: vs.value, idType: vt.value, idNumber: vi.value, docUrl, status: "Pending", adminNote: "", submittedAt: serverTimestamp() });
          await gate();
        } catch (error) {
          vmsg.className = "mt-2 text-danger"; vmsg.textContent = error.message || "Could not submit verification.";
          button.disabled = false;
        }
      };
    }
    async function load() {
      const key = me.role === "seller" ? "sellerId" : "buyerId";
      if (me.role === "seller" && me.approved) {
        prods = await list(query(collection(db, "products"), where("sellerId", "==", me.uid)));
        pl.innerHTML = "<thead><tr><th>Name</th><th>Price</th><th>Stock</th><th></th></tr></thead>" + prods.map(x => `<tr><td>${esc(x.name)}</td><td>${money(x.price)}</td><td>${x.stock}</td><td class="text-nowrap"><button class="btn btn-sm btn-outline-primary" data-a="edit" data-id="${x.id}">Edit</button> <button class="btn btn-sm btn-outline-danger" data-a="del" data-id="${x.id}">Delete</button></td></tr>`).join("");
      }
      const os = (await list(query(collection(db, "orders"), where(key, "==", me.uid)))).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      const bt = (s, t, cls) => `<button class="btn btn-sm btn-${cls}" data-s="${s}" data-o="`;
      ol.innerHTML = "<thead><tr><th>Product</th><th>Qty</th><th>Total</th><th>" + (me.role === "seller" ? "Buyer" : "Seller") + "</th><th>Status</th><th></th></tr></thead>" + (os.map(o => {
        let b = "";
        if (me.role === "buyer" && o.status === "Pending") b = bt("Cancelled", "", "outline-danger") + o.id + '">Cancel</button>';
        if (me.role === "seller" && o.status === "Pending") b = bt("Accepted", "", "success") + o.id + '">Accept</button> ' + bt("Rejected", "", "outline-danger") + o.id + '">Reject</button>';
        if (me.role === "seller" && o.status === "Accepted") b = bt("Completed", "", "success") + o.id + '">Mark completed</button>';
        const contact = me.role === "seller" ? `${esc(o.buyerName)} (${esc(o.buyerPhone)})<br><small>Deliver to: ${esc(o.buyerAddress || "No address provided")}</small>` : esc(o.sellerName);
        return `<tr><td>${esc(o.productName)}<br><small class="text-muted">${esc(o.note)}</small></td><td>${o.qty}</td><td>${money(o.price * o.qty)}</td><td>${contact}</td><td>${badge(o.status)}</td><td class="text-nowrap">${b}</td></tr>`;
      }).join("") || '<tr><td colspan="6">No orders yet.</td></tr>');
    }
    ol.onclick = async e => {
      const status = e.target.dataset.s, orderId = e.target.dataset.o;
      if (!status) return;
      try {
        if (status === "Accepted") {
          await runTransaction(db, async transaction => {
            const orderRef = doc(db, "orders", orderId);
            const orderSnapshot = await transaction.get(orderRef);
            if (!orderSnapshot.exists()) throw new Error("This order no longer exists.");
            const order = orderSnapshot.data();
            if (order.status !== "Pending" || order.sellerId !== me.uid) throw new Error("This order is no longer available to accept.");

            const productRef = doc(db, "products", order.productId);
            const productSnapshot = await transaction.get(productRef);
            if (!productSnapshot.exists()) throw new Error("This product no longer exists.");
            const product = productSnapshot.data();
            const stock = Number(product.stock) || 0, quantity = Number(order.qty);
            if (!Number.isInteger(quantity) || quantity < 1) throw new Error("This order has an invalid quantity.");
            if (stock < quantity) throw new Error(`Only ${stock} item(s) remain in stock.`);

            transaction.update(productRef, { stock: stock - quantity });
            transaction.update(orderRef, { status });
          });
          invalidateCatalogCache("products", "featured-products");
        } else await updateDoc(doc(db, "orders", orderId), { status });
        await load();
      } catch (error) { say(m, error.message || "Could not update the order.", false); }
    };
    pl.onclick = async e => {
      const { a, id } = e.target.dataset; if (!a) return;
      if (a === "del" && confirm("Delete this product?")) { await deleteDoc(doc(db, "products", id)); invalidateCatalogCache("products", "featured-products"); load(); }
      if (a === "edit") { const x = prods.find(q => q.id === id); editId = id; currentProductImage = x.imageUrl; pt.textContent = "Edit product"; pn.value = x.name; pc.value = x.categoryId; pp.value = x.price; ps.value = x.stock; pi.required = false; pipreview.src = currentProductImage; pipreview.hidden = false; pd.value = x.description; scrollTo(0, 0); }
    };
    pi.onchange = () => {
      if (productPreviewUrl) URL.revokeObjectURL(productPreviewUrl);
      if (pi.files[0]) { productPreviewUrl = URL.createObjectURL(pi.files[0]); pipreview.src = productPreviewUrl; pipreview.hidden = false; }
      else if (currentProductImage) { pipreview.src = currentProductImage; pipreview.hidden = false; }
      else pipreview.hidden = true;
    };
    pr.onclick = () => { editId = null; currentProductImage = ""; pf.reset(); pi.required = true; pipreview.hidden = true; pt.textContent = "Add a product"; };
    pf.onsubmit = async e => {
      e.preventDefault();
      const button = pf.querySelector("button[type=submit]"); button.disabled = true;
      try {
        const file = pi.files[0];
        const imageUrl = file ? await uploadProductImage(file, me.uid) : currentProductImage;
        if (!imageUrl) throw new Error("Choose a product image to upload.");
        const data = { name: pn.value, categoryId: pc.value, categoryName: pc.selectedOptions[0].dataset.n, price: Number(pp.value), stock: Number(ps.value), imageUrl, description: pd.value, sellerId: me.uid, sellerName: me.name };
        if (editId) await updateDoc(doc(db, "products", editId), data); else await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
        invalidateCatalogCache("products", "featured-products");
        say(m, "Product saved.", true); pr.click(); load();
      } catch (error) { say(m, error.message || "Could not save product.", false); }
      finally { button.disabled = false; }
    };
  </script>
</body>

</html>
