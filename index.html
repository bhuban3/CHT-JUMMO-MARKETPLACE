<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>CHT Jummo Marketplace</title>
</head>

<body>
  <header id="nav"></header>
  <section class="hero py-5">
    <div class="container py-4">
      <h1 class="display-5 fw-bold col-lg-7">Buy directly from Hill Tracts makers</h1>
      <p class="lead col-lg-6 text-white">Handloom, bamboo work and fresh produce from verified farmers and artisans
        of the Chittagong Hill Tracts. Send an order request and the seller confirms it.</p>
      <a class="btn btn-danger me-2" href="products.html">Browse products</a><a class="btn btn-outline-light"
        href="register.html">Sell your products</a>
    </div>
  </section>
  <main class="container py-4">
    <h2 class="h4">Categories</h2>
    <div id="cats_" class="d-flex flex-wrap gap-2 mb-4"></div>
    <h2 class="h4">Newest products</h2>
    <div id="feat" class="row g-3"></div>
  </main>
  <footer id="site-footer"></footer>
  <div class="modal fade" id="productDetails" tabindex="-1" aria-labelledby="detailName" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="detailName"></h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="detailImage" class="product-detail-image mb-3" alt="">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2"><span class="badge text-bg-light" id="detailCategory"></span><strong class="text-success" id="detailPrice"></strong></div>
          <p id="detailDescription"></p>
          <div class="small text-muted" id="detailSeller"></div>
          <div class="small text-muted" id="detailStock"></div>
        </div>
        <div class="modal-footer"><a class="btn btn-success" href="products.html">Browse products</a></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { onUser, db, collection, listCatalog, query, orderBy, limit, esc, money } from "./js/app.js";
    const detailsModal = new bootstrap.Modal(productDetails);
    onUser(async () => {
      const renderCategories = cats => {
        cats_.innerHTML = cats.map(c => `<a class="btn btn-outline-primary btn-sm" href="products.html?cat=${encodeURIComponent(c.id)}">${esc(c.name)}</a>`).join("") || '<span class="text-muted">No categories yet.</span>';
      };
      const renderProducts = ps => {
      feat.innerHTML = ps.map(p => `<div class="col-6 col-md-4 col-lg-3"><div class="card h-100">
        <button class="product-card-trigger" type="button" data-view="${esc(p.id)}" aria-label="View details for ${esc(p.name)}">
          <img src="${esc(p.imageUrl)}" class="card-img-top" alt="" loading="lazy" decoding="async">
          <div class="card-body d-flex flex-column gap-1 text-start"><h3 class="h6 mb-0">${esc(p.name)}</h3><span class="badge text-bg-light align-self-start">${esc(p.categoryName)}</span><strong class="text-success">${money(p.price)}</strong><small class="text-muted">by ${esc(p.sellerName)}</small></div>
        </button>
      </div></div>`).join("") || '<p class="text-muted">No products yet. Verified sellers can add the first one.</p>';
        feat.onclick = e => {
          const id = e.target.closest("[data-view]")?.dataset.view;
          const product = ps.find(item => item.id === id);
          if (!product) return;
          detailName.textContent = product.name;
          detailImage.src = product.imageUrl;
          detailCategory.textContent = product.categoryName;
          detailPrice.textContent = money(product.price);
          detailDescription.textContent = product.description;
          detailSeller.textContent = "Sold by " + product.sellerName;
          detailStock.textContent = product.stock + " in stock";
          detailsModal.show();
        };
      };
      await Promise.all([
        listCatalog("categories", collection(db, "categories"), renderCategories),
        listCatalog("featured-products", query(collection(db, "products"), orderBy("createdAt", "desc"), limit(8)), renderProducts)
      ]);
    });
  </script>
</body>

</html>
