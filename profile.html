<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>My profile</title>
</head>

<body>
  <header id="nav"></header>
  <main class="container">
    <form class="card card-body mx-auto my-4" style="max-width:460px" id="f">
      <h1 class="h3">My profile</h1>
      <div id="m"></div>
      <label class="form-label" for="n">Full name</label><input class="form-control" id="n" required>
      <label class="form-label mt-3" for="ph">Phone</label><input class="form-control" id="ph" required>
      <label class="form-label mt-3" for="ad">Address</label><input class="form-control" id="ad" required>
      <p class="text-muted small mt-3" id="info"></p><button class="btn btn-primary">Save changes</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { guard, db, doc, updateDoc, say } from "./js/app.js";
    guard(["buyer", "seller", "admin"], p => {
      n.value = p.name; ph.value = p.phone || ""; ad.value = p.address || "";
      info.textContent = "Email: " + p.email + " · Role: " + p.role;
      f.onsubmit = async e => { e.preventDefault(); await updateDoc(doc(db, "users", p.uid), { name: n.value, phone: ph.value, address: ad.value }); say(m, "Profile saved.", true); };
    });
  </script>
</body>

</html>
