<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Register</title>
</head>

<body>
  <header id="nav"></header>
  <main class="container">
    <form class="card card-body mx-auto my-4" style="max-width:460px" id="f">
      <h1 class="h3">Create your account</h1>
      <div id="m"></div>
      <label class="form-label" for="n">Full name</label><input class="form-control" id="n" required>
      <label class="form-label mt-3" for="e">Email</label><input class="form-control" id="e" type="email" required>
      <label class="form-label mt-3" for="p">Password (6+ characters)</label><input class="form-control" id="p"
        type="password" minlength="6" required>
      <label class="form-label mt-3" for="ph">Phone</label><input class="form-control" id="ph" required>
      <label class="form-label mt-3" for="ad">Address</label><input class="form-control" id="ad" required>
      <label class="form-label mt-3" for="r">I want to</label><select class="form-select" id="r">
        <option value="buyer">Buy products</option>
        <option value="seller">Sell products</option>
      </select>
      <div class="form-text" id="hint"></div>
      <button class="btn btn-primary mt-4">Create account</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { renderNav, auth, createUserWithEmailAndPassword, sendEmailVerification, signOut, db, doc, setDoc, serverTimestamp, say } from "./js/app.js";
    renderNav(null);
    r.onchange = () => hint.textContent = r.value === "seller" ? "Sellers must submit identity verification after registering. You can list products once the admin approves it." : "";
    f.onsubmit = async e => {
      e.preventDefault();
      try {
        const c = await createUserWithEmailAndPassword(auth, e.target.e.value, e.target.p.value);
        await setDoc(doc(db, "users", c.user.uid), { name: n.value, email: e.target.e.value, phone: ph.value, address: ad.value, role: r.value, approved: r.value === "buyer", createdAt: serverTimestamp() });
        await sendEmailVerification(c.user);
        await signOut(auth);
        f.reset();
        say(m, "Account created. Check your email for a verification link, then log in.", true);
      } catch (err) { say(m, err.code === "auth/email-already-in-use" ? "This email is already registered. Log in instead." : "Could not register: " + err.message); }
    };
  </script>
</body>

</html>
