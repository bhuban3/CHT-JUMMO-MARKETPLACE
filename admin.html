<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Admin panel</title>
</head>

<body>
  <header id="nav"></header>
  <main class="container py-4">
    <h1 class="h3">Admin panel</h1>
    <h2 class="h5 mt-4">Seller verification requests</h2>
    <div class="table-responsive card card-body">
      <table class="table align-middle mb-0" id="vl"></table>
    </div>
    <h2 class="h5 mt-4">Categories</h2>
    <form class="row g-2 mb-2" id="cf">
      <div class="col-8 col-md-4"><input class="form-control" id="cn" placeholder="New category name" required></div>
      <div class="col-4"><button class="btn btn-primary">Add</button></div>
    </form>
    <div class="table-responsive card card-body">
      <table class="table mb-0" id="cl"></table>
    </div>
    <h2 class="h5 mt-4">All products</h2>
    <div class="table-responsive card card-body">
      <table class="table align-middle mb-0" id="pl"></table>
    </div>
    <h2 class="h5 mt-4">Report: orders (excluding cancelled and rejected)</h2>
    <div class="row g-3">
      <div class="col-md-6">
        <div class="table-responsive card card-body">
          <table class="table mb-0" id="r1"></table>
        </div>
      </div>
      <div class="col-md-6">
        <div class="table-responsive card card-body">
          <table class="table mb-0" id="r2"></table>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { guard, db, collection, doc, list, addDoc, updateDoc, deleteDoc, esc, money, badge } from "./js/app.js";
    guard(["admin"], load);
    async function load() {
      const [cs, ps, os, vv] = await Promise.all(["categories", "products", "orders", "verifications"].map(c => list(collection(db, c))));
      const rows = vv.sort((a, b) => (a.status === "Pending" ? 0 : 1) - (b.status === "Pending" ? 0 : 1));
      vl.innerHTML = "<thead><tr><th>Seller</th><th>Shop</th><th>ID</th><th>Document</th><th>Status</th><th></th></tr></thead>" + (rows.map(v => `<tr><td>${esc(v.fullName)}<br><small class="text-muted">${esc(v.sellerName)}</small></td><td>${esc(v.shopName)}</td><td>${esc(v.idType)}<br>${esc(v.idNumber)}</td><td><a href="${esc(v.docUrl)}" target="_blank" rel="noopener">View</a></td><td>${badge(v.status)}${v.adminNote ? `<br><small>${esc(v.adminNote)}</small>` : ""}</td><td class="text-nowrap">${v.status === "Pending" ? `<button class="btn btn-sm btn-success" data-a="vok" data-id="${v.id}">Approve</button> <button class="btn btn-sm btn-outline-danger" data-a="vno" data-id="${v.id}">Reject</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="6">No verification requests yet.</td></tr>');
      cl.innerHTML = cs.map(c => `<tr><td>${esc(c.name)}</td><td class="text-end"><button class="btn btn-sm btn-outline-danger" data-a="dc" data-id="${c.id}">Delete</button></td></tr>`).join("") || "<tr><td>No categories yet. Add one above.</td></tr>";
      pl.innerHTML = "<thead><tr><th>Product</th><th>Seller</th><th>Price</th><th></th></tr></thead>" + ps.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.sellerName)}</td><td>${money(p.price)}</td><td><button class="btn btn-sm btn-outline-danger" data-a="dp" data-id="${p.id}">Remove</button></td></tr>`).join("");
      const live = os.filter(o => !["Cancelled", "Rejected"].includes(o.status));
      const group = k => { const g = {}; live.forEach(o => { g[o[k]] ??= { n: 0, v: 0 }; g[o[k]].n++; g[o[k]].v += o.price * o.qty; }); return g; };
      const tbl = (t, g) => `<thead><tr><th>${t}</th><th>Orders</th><th>Value</th></tr></thead>` + Object.entries(g).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${money(v.v)}</td></tr>`).join("");
      r1.innerHTML = tbl("Category", group("categoryName")); r2.innerHTML = tbl("Seller", group("sellerName"));
    }
    document.body.onclick = async e => {
      const { a, id } = e.target.dataset; if (!a) return;
      if (a === "vok") { await updateDoc(doc(db, "verifications", id), { status: "Approved", adminNote: "" }); await updateDoc(doc(db, "users", id), { approved: true }); }
      if (a === "vno") { const note = prompt("Reason for rejection (the seller will see this):"); if (note === null) return; await updateDoc(doc(db, "verifications", id), { status: "Rejected", adminNote: note }); await updateDoc(doc(db, "users", id), { approved: false }); }
      if (a === "dc" && confirm("Delete category?")) await deleteDoc(doc(db, "categories", id));
      if (a === "dp" && confirm("Remove product?")) await deleteDoc(doc(db, "products", id));
      load();
    };
    cf.onsubmit = async e => { e.preventDefault(); await addDoc(collection(db, "categories"), { name: cn.value }); cf.reset(); load(); };
  </script>
</body>

</html>
